# 日常检查：只在 Linux 上跑（1x 分钟，几乎不消耗额度）
# 按 docs/PLAN.md §1.5 的约定 —— macOS 构建只在里程碑打 tag 时触发（见 release.yml）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 类型检查 · 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（纯逻辑内核，Vitest）
        run: npm test

      - name: 前端构建（tsc + vite build）
        run: npm run build

      # 公开仓库的必备防线：.gitignore 挡不住「已跟踪文件」和「硬编码」，
      # 这里对已入库内容再扫一遍（见 docs/DESIGN.md §11.6）
      - name: 密钥扫描
        run: npm run check:secrets

  # Rust 侧存储层单测（Linux，便宜，不产出安装包）
  rust-test:
    name: Rust 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri 的 build script 需要系统依赖（glib/gtk/webkit2gtk）才能编译
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: cargo test（storage 等纯逻辑）
        run: cargo test --manifest-path src-tauri/Cargo.toml

