name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Desktop types, tests, build and public-source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Check desktop source
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run check:secrets
          node scripts/verify-sync-core.mjs

  rust-test:
    name: Native Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf pkg-config
      - name: Run native tests against Cargo.lock
        run: cargo +1.95.0 test --manifest-path src-tauri/Cargo.toml --locked --lib

  android-check:
    name: Android types, lint and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: '1'
      LSQ_EXCHANGE_QA: ${{ github.workspace }}/.local/exchange-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.14
          cache: pip
          cache-dependency-path: scripts/knowledge-exchange-requirements.txt
      - name: Install locked offline knowledge exchange dependencies
        run: python -m pip install -r scripts/knowledge-exchange-requirements.txt
      # Android contracts import the actual public desktop adapter and Tauri types.
      - name: Install locked cross-platform dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Android dependencies
        working-directory: android-app
        run: npm ci --no-audit --no-fund
      - name: Check Android source
        working-directory: android-app
        run: |
          npm run typecheck
          npm run lint
          npm run test:contracts
          npm run test:knowledge-exchange
