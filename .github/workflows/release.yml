# 里程碑构建：打 tag（v*）才触发，产出 macOS 与 Windows 安装包
# 公开仓库下 Actions 分钟数不限，但仍按里程碑节奏构建（ADR-007）
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macos-15，Apple Silicon arm64
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Rust 冷编译 15-25 分钟，缓存后降到 3-6 分钟（风险 R-1）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── 签名与公证 ────────────────────────────────────────────
          # ADR-008：一期不做签名，出 ad-hoc 构建（自用 + 极小范围分享）。
          # 日后若需顺畅分发，在仓库 Settings → Secrets 补上以下变量，
          # tauri-action 会自动完成 签名 → 公证 → staple：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: v__VERSION__
          releaseName: 'Lumen v__VERSION__'
          releaseBody: |
            脉络 Lumen 构建产物。

            - macOS：Apple Silicon (arm64)。两种取用方式，二选一：
              - `Lumen_<版本>_aarch64.zip` —— 解压即得 `Lumen.app`，拖进「应用程序」即可（推荐，无需装 dmg）。
              - `Lumen_<版本>_aarch64.dmg` —— 传统磁盘映像。
              已做 ad-hoc 自签名（未做 Apple 公证）：首次运行请右键 →「打开」→ 确认；
              若仍被拦，执行 `xattr -dr com.apple.quarantine /Applications/Lumen.app` 后再打开。
            - Windows：NSIS 安装包 / MSI。未签名，SmartScreen 提示时选择「仍要运行」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # macOS：把 .app 用官方推荐的 ditto 打成 zip（Finder 双击直接出 App，
      # 保留权限与 quarantine 之外的元数据），并挂到同一个 release。
      - name: 打包 macOS .app 为 zip 并上传
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP_PATH" ]; then echo "未找到 .app 产物"; exit 1; fi
          APP_NAME=$(basename "$APP_PATH" .app)
          ARCH=$(echo "${{ matrix.rust_target }}" | cut -d- -f1)
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="${APP_NAME}_${VERSION}_${ARCH}.zip"
          # ── ad-hoc 自签名（关键）───────────────────────────────────
          # Apple Silicon 要求所有代码至少有一个有效签名，否则内核拒绝加载并
          # 误报「已损坏，应移到废纸篓」。codesign --sign - 即 ad-hoc 自签名，
          # 无需 Apple 开发者账号；配合 tauri.conf.json 的 signingIdentity:"-"
          # 双保险，确保 zip 内的 .app 一定带签名。
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          echo "打包 $APP_PATH -> $ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          # 草稿 release 用 --clobber 覆盖同名资产，按 tag 定位
          gh release upload "${GITHUB_REF_NAME}" "$ZIP_NAME" --clobber --repo "${GITHUB_REPOSITORY}"

      # ── 发版自检：release 建出来了吗？产物齐了吗？（只告警，不阻断构建）──
      # 踩坑记录（v0.1.7 排查所得，勿再重复排查）：
      # 1) draft 状态下，API 返回的 html_url 是 /releases/tag/untagged-xxxx，
      #    按 tag 查（GET /releases/tags/<tag>）会 404，gh release view/delete
      #    也因此报错；**发布（draft=false）之后 html_url 会自动变回
      #    /releases/tag/<tag>，按 tag 查也恢复正常**。所以不要拿
      #    html_url 判断 release「有没有挂到 tag 上」，那是 draft 的正常表现。
      # 2) gh 2.92.0 的 `release create <tag>` 在该 tag 尚无 release 时会报
      #    "no matches found for `<tag>`"，加 --verify-tag 时也报同样的错。
      #    要在 CI 里建 release，直接用 REST：POST /releases（tag_name 必填）。
      # 3) Windows runner 的默认 shell 是 PowerShell，bash 脚本必须显式写
      #    `shell: bash`，否则 ParserError。
      # 4) `gh api --jq` 的表达式必须用单引号包起来：写成双引号时里面的 \" 会被
      #    逐层吃掉，jq 收到的是 `.tag_name==v0.1.8`（少了引号）→ invalid token，
      #    直接把发版跑红（v0.1.8 踩过）。需要插值时用 \(.field) 配单引号，或把
      #    过滤交给 awk/grep，别在双引号里拼正则。
      # 5) 这一步只提示、绝不 exit 1：产物已经传出去了，为一个自检告警把整个
      #    Release 标红不划算（同样是 v0.1.8 的教训）。
      - name: 校验 Release 产物
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REL=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | "\(.id) \(.tag_name)"' | awk -v t="$TAG" '$2==t { print $1; exit }')
          if [ -z "$REL" ]; then
            echo "::warning::按 tag_name 找不到 ${TAG} 对应的 release（draft 阶段按 tag 查会 404，属正常现象）"
            exit 0
          fi
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${REL}" --jq '.assets[].name')
          echo "release ${TAG}（id ${REL}）现有产物："
          echo "$ASSETS"
          for n in "Lumen_${VERSION}_aarch64.dmg" "Lumen_${VERSION}_aarch64.zip" "Lumen_aarch64.app.tar.gz"; do
            if ! echo "$ASSETS" | grep -qx "$n"; then
              echo "::warning::产物缺失：${n}"
            fi
          done


