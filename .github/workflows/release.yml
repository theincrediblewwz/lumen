# 里程碑构建：打 tag（v*）才触发，产出 macOS 与 Windows 安装包
# 公开仓库下 Actions 分钟数不限，但仍按里程碑节奏构建（ADR-007）
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macos-15，Apple Silicon arm64
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Rust 冷编译 15-25 分钟，缓存后降到 3-6 分钟（风险 R-1）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── 签名与公证 ────────────────────────────────────────────
          # ADR-008：一期不做签名，出 ad-hoc 构建（自用 + 极小范围分享）。
          # 日后若需顺畅分发，在仓库 Settings → Secrets 补上以下变量，
          # tauri-action 会自动完成 签名 → 公证 → staple：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: v__VERSION__
          releaseName: 'Lumen v__VERSION__'
          releaseBody: |
            脉络 Lumen 构建产物。

            - macOS：Apple Silicon (arm64)。两种取用方式，二选一：
              - `Lumen_<版本>_aarch64.zip` —— 解压即得 `Lumen.app`，拖进「应用程序」即可（推荐，无需装 dmg）。
              - `Lumen_<版本>_aarch64.dmg` —— 传统磁盘映像。
              已做 ad-hoc 自签名（未做 Apple 公证）：首次运行请右键 →「打开」→ 确认；
              若仍被拦，执行 `xattr -dr com.apple.quarantine /Applications/Lumen.app` 后再打开。
            - Windows：NSIS 安装包 / MSI。未签名，SmartScreen 提示时选择「仍要运行」。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # macOS：把 .app 用官方推荐的 ditto 打成 zip（Finder 双击直接出 App，
      # 保留权限与 quarantine 之外的元数据），并挂到同一个 release。
      - name: 打包 macOS .app 为 zip 并上传
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP_PATH" ]; then echo "未找到 .app 产物"; exit 1; fi
          APP_NAME=$(basename "$APP_PATH" .app)
          ARCH=$(echo "${{ matrix.rust_target }}" | cut -d- -f1)
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="${APP_NAME}_${VERSION}_${ARCH}.zip"
          # ── ad-hoc 自签名（关键）───────────────────────────────────
          # Apple Silicon 要求所有代码至少有一个有效签名，否则内核拒绝加载并
          # 误报「已损坏，应移到废纸篓」。codesign --sign - 即 ad-hoc 自签名，
          # 无需 Apple 开发者账号；配合 tauri.conf.json 的 signingIdentity:"-"
          # 双保险，确保 zip 内的 .app 一定带签名。
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          echo "打包 $APP_PATH -> $ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          # 草稿 release 用 --clobber 覆盖同名资产，按 tag 定位
          gh release upload "${GITHUB_REF_NAME}" "$ZIP_NAME" --clobber --repo "${GITHUB_REPOSITORY}"


