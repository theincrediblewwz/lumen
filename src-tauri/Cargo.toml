[package]
name = "lumen"
version = "0.1.0"
description = "脉络 Lumen — 本地优先的极简白板"
authors = ["theincrediblewwz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"

# 原生窗口材质（液态玻璃 / 毛玻璃）。apply_liquid_glass(macOS 26+) 目前仅在
# dev 分支，故用 git 依赖；稳定后可切回 crates.io 版本。
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = { git = "https://github.com/tauri-apps/window-vibrancy", branch = "dev" }
