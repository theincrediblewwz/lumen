[package]
name = "lumen"
version = "0.1.5"
description = "脉络 Lumen — 本地优先的极简白板"
authors = ["theincrediblewwz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
# 文档编码探测：BOM / UTF-8 / GB18030 回退（M4-7）
encoding_rs = "0.8"
chardetng = "0.1"
# AI 流式请求（M5-2）：前端零网络，HTTP 传输统一走 Rust
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"
once_cell = "1"
# API Key 加密落盘（M5-7）：用操作系统原生凭据库（macOS Keychain /
# Windows 凭据管理器 / Linux Secret Service），密钥不写进我们自己的磁盘文件。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 原生窗口材质（液态玻璃 / 毛玻璃）。apply_liquid_glass(macOS 26+) 目前仅在
# dev 分支，故用 git 依赖；稳定后可切回 crates.io 版本。
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = { git = "https://github.com/tauri-apps/window-vibrancy", branch = "dev" }




